name: Build Kagura Kernel (Pie)

on:
  push:
    branches: [ "aosp/LA.UM.5.5.r1" ]
  workflow_dispatch:

env:
  ARCH: arm64
  DEFCONFIG: kagura_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: 'aosp/LA.UM.5.5.r1'
          fetch-depth: 1
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git make bc bison flex libssl-dev \
            libelf-dev python3 zip curl wget \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Integrate ResuKisu
        run: |
          cd $GITHUB_WORKSPACE/kernel
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" \
            | bash -s main
          echo "CONFIG_KSU=y" >> arch/arm64/configs/kagura_defconfig

      - name: Fix ResuKisu kernel compat
        run: |
          python3 - <<'EOF'
          import os

          # Fix 1: session_keyring guard
          compat = "/home/runner/work/kernel/kernel/kernel/drivers/kernelsu/infra/kernel_compat.h"
          if os.path.exists(compat):
              with open(compat, 'r') as f:
                  c = f.read()
              c = c.replace(
                  'if (init_session_keyring != NULL && !current_cred()->session_keyring',
                  '#ifdef CONFIG_KEYS\n\tif (init_session_keyring != NULL && !current_cred()->session_keyring'
              )
              c = c.replace(
                  'return inode->i_security;',
                  '#ifdef CONFIG_SECURITY\n\treturn inode->i_security;\n#else\n\treturn NULL;\n#endif'
              )
              c = c.replace(
                  'return cred->security;',
                  '#ifdef CONFIG_SECURITY\n\treturn cred->security;\n#else\n\treturn NULL;\n#endif'
              )
              with open(compat, 'w') as f:
                  f.write(c)
              print("Fixed kernel_compat.h")

          # Fix 2: Add ptrace include to syscall.h
          syscall = "/home/runner/work/kernel/kernel/kernel/arch/arm64/include/asm/syscall.h"
          if os.path.exists(syscall):
              with open(syscall, 'r') as f:
                  c = f.read()
              if '#include <asm/ptrace.h>' not in c:
                  c = c.replace('#ifndef __ASM_SYSCALL_H',
                      '#ifndef __ASM_SYSCALL_H\n#include <asm/ptrace.h>')
                  with open(syscall, 'w') as f:
                      f.write(c)
              print("Fixed syscall.h")
          EOF

      - name: Fix DTC yylloc bug
        run: |
          sed -i 's/YYLTYPE yylloc/extern YYLTYPE yylloc/' \
            $GITHUB_WORKSPACE/kernel/scripts/dtc/dtc-lexer.lex.c_shipped

      - name: Fix regulator header bug
        run: |
          sed -i 's/struct regulator_ocp_notification \*ocp_notification);/struct regulator_ocp_notification *ocp_notification)/' \
            $GITHUB_WORKSPACE/kernel/include/linux/regulator/consumer.h

      - name: Fix dma-removed declaration
        run: |
          sed -i '/^#ifdef CONFIG_OF_RESERVED_MEM/a extern void dma_contiguous_early_fixup(phys_addr_t base, phys_addr_t size);' \
            $GITHUB_WORKSPACE/kernel/drivers/base/dma-removed.c

      - name: Fix log2.h conflicting attributes
        run: |
          sed -i 's/__attribute__((const, noreturn))/__attribute__((noreturn))/' \
            $GITHUB_WORKSPACE/kernel/include/linux/log2.h

      - name: Build kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            kagura_defconfig
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS="-fcommon" \
            KCFLAGS="-Wno-error" \
            -j$(nproc) 2>&1 | tee build.log

      - name: Check output
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image" ]; then
            echo "❌ Build failed — first errors:"
            grep -i "error:" $GITHUB_WORKSPACE/kernel/build.log | head -20
            exit 1
          fi
          echo "✅ Success!"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kagura-Kernel-Pie-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image
            ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.gz-dtb
