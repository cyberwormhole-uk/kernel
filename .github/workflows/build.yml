name: Build Kagura Kernel (Pie)

on:
  push:
    branches: [ "aosp/LA.UM.5.5.r1" ]
  workflow_dispatch:

env:
  ARCH: arm64
  DEFCONFIG: kagura_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: 'aosp/LA.UM.5.5.r1'
          fetch-depth: 1
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git make bc bison flex libssl-dev \
            libelf-dev python3 zip curl wget \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Integrate ResuKisu (legacy 4.9)
        run: |
          cd $GITHUB_WORKSPACE/kernel
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" \
            | bash -s v3.0.0-30-legacy
          echo "CONFIG_KSU=y" >> arch/arm64/configs/kagura_defconfig

      - name: Fix flask.h missing
        run: |
          python3 -c "
          import os
          path = '$GITHUB_WORKSPACE/kernel/security/selinux/include'
          os.makedirs(path, exist_ok=True)
          flask = os.path.join(path, 'flask.h')
          if not os.path.exists(flask):
              with open(flask, 'w') as f:
                  f.write('#ifndef _SELINUX_FLASK_H_\n')
                  f.write('#define _SELINUX_FLASK_H_\n')
                  f.write('#define SECCLASS_PROCESS 1\n')
                  f.write('#define SECCLASS_FILE 2\n')
                  f.write('#define SECCLASS_DIR 3\n')
                  f.write('#define SECSID_WILD 0\n')
                  f.write('#define SECINITSID_KERNEL 1\n')
                  f.write('#define SECINITSID_SECURITY 2\n')
                  f.write('#define SECINITSID_UNLABELED 3\n')
                  f.write('#define SECINITSID_FS 4\n')
                  f.write('#define SECINITSID_FILE 5\n')
                  f.write('#define SECINITSID_ANY_SOCKET 10\n')
                  f.write('#define SECINITSID_PORT 11\n')
                  f.write('#define SECINITSID_NETIF 12\n')
                  f.write('#define SECINITSID_NUM 27\n')
                  f.write('#endif\n')
              print('Created stub flask.h')
          "

      - name: Fix DTC yylloc bug
        run: |
          sed -i 's/YYLTYPE yylloc/extern YYLTYPE yylloc/' \
            $GITHUB_WORKSPACE/kernel/scripts/dtc/dtc-lexer.lex.c_shipped

      - name: Fix regulator header bug
        run: |
          sed -i 's/struct regulator_ocp_notification \*ocp_notification);/struct regulator_ocp_notification *ocp_notification)/' \
            $GITHUB_WORKSPACE/kernel/include/linux/regulator/consumer.h

      - name: Fix dma-removed declaration
        run: |
          sed -i '/^#ifdef CONFIG_OF_RESERVED_MEM/a extern void dma_contiguous_early_fixup(phys_addr_t base, phys_addr_t size);' \
            $GITHUB_WORKSPACE/kernel/drivers/base/dma-removed.c

      - name: Fix log2.h conflicting attributes
        run: |
          sed -i 's/__attribute__((const, noreturn))/__attribute__((noreturn))/' \
            $GITHUB_WORKSPACE/kernel/include/linux/log2.h

      - name: Fix KernelSU groups_sort declaration
        run: |
          FILE=$GITHUB_WORKSPACE/kernel/drivers/kernelsu/app_profile.c
          if [ -f "$FILE" ]; then
            {
              echo '#ifndef _APP_PROFILE_GROUPS_SORT_DECLARED'
              echo '#define _APP_PROFILE_GROUPS_SORT_DECLARED'
              echo ''
              head -n 1 "$FILE"
              echo 'extern void groups_sort(struct group_info *group_info);'
              echo ''
              tail -n +2 "$FILE"
              echo ''
              echo '#endif'
            } > "$FILE.tmp"
            mv "$FILE.tmp" "$FILE"
            echo "Fixed groups_sort"
          fi

      - name: Fix KernelSU strscpy missing
        run: |
          FILE=$GITHUB_WORKSPACE/kernel/drivers/kernelsu/throne_tracker.c
          if [ -f "$FILE" ]; then
            {
              echo '#include <linux/string.h>'
              cat "$FILE"
            } > "$FILE.tmp"
            mv "$FILE.tmp" "$FILE"
            echo "Fixed: added linux/string.h to throne_tracker.c"
          else
            echo "File not found, skipping"
          fi

      - name: Generate defconfig and prepare headers
        run: |
          cd $GITHUB_WORKSPACE/kernel
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            kagura_defconfig
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS="-fcommon" \
            prepare 2>&1 || true

      - name: Build kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS="-fcommon" \
            KCFLAGS="-Wno-error" \
            -j$(nproc) 2>&1 | tee build.log

      - name: Check output
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image" ]; then
            echo "Build failed - first errors:"
            grep -i "error:" $GITHUB_WORKSPACE/kernel/build.log | head -20
            exit 1
          fi
          echo "Success!"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kagura-Kernel-Pie-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image
            ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.gz-dtb
